version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URI=mongodb://mongo:27017/neet
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-your-secret-here}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./public:/app/public
      - media:/app/public/media

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    command: --storageEngine=wiredTiger
    restart: unless-stopped
    logging:
      driver: none

  # Development override - use docker-compose.dev.yml for local dev
  # Run: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

volumes:
  mongo-data:
  media:
